name: Deploy to Cloudflare

# Optional. The simpler path is to connect this repository in the Cloudflare
# dashboard (Workers & Pages → Create → Import a repository), which needs no
# secrets at all. See docs/DEPLOY.md.
#
# This workflow exists for the case where you want deploys driven by GitHub.
# It requires two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Skip cleanly on forks and where the token has not been configured.
    if: github.repository_owner == 'MaxDoubin'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate before publishing
        run: npm run validate:strict && npm test

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
