name: Bug
description: Something in the site, build or tooling is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a wrong *number*, use the Data correction template instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and browser
      description: "`node --version`, plus your browser if it is a site issue."
