name: Data correction
description: A figure in the dataset is wrong
title: "[correction] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are the most valuable contribution to this project. The one thing that is required is a
        **source document** — without it a correction cannot be accepted, because the whole dataset rests on
        provenance.
  - type: input
    id: row
    attributes:
      label: Which row
      description: The `id` from the CSV, e.g. `fy2024-novva-reno`. Or the file and line.
      placeholder: fy2024-novva-reno
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Which field
      placeholder: county
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source document
      description: URL, plus the page or table where the figure appears. A GOED board packet is ideal.
      placeholder: |
        https://goed.nv.gov/wp-content/uploads/2024/01/...pdf — page 1, "Application Facts" table
    validations:
      required: true
  - type: dropdown
    id: conflict
    attributes:
      label: Does another official source say something different?
      description: If so this becomes a discrepancy record rather than a straight overwrite.
      options:
        - "No — the current value is simply an error in this dataset"
        - "Yes — two official sources disagree"
        - "Not sure"
    validations:
      required: true
